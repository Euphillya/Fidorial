name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      upload-jar: true
      retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: fidorial-server
          path: dist

      - name: Publish stable release
        uses: softprops/action-gh-release@v2
        with:
          name: Fidorial ${{ github.ref_name }}
          files: dist/*.jar
          generate_release_notes: true
          draft: false
          prerelease: false
