name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Check for [ci-skip]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}

    steps:
      - name: Look for the marker
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ -z "$PR" ]; then
            echo "Manual run, nothing to check."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Title of the pull request + message of its latest commit
          text=$(gh pr view "$PR" --repo "$REPO" --json title,commits \
            --jq '[.title, .commits[-1].messageHeadline, .commits[-1].messageBody] | join(" ")')

          if printf '%s' "$text" | grep -qF '[ci-skip]'; then
            echo "::notice::[ci-skip] found, the build is skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    uses: ./.github/workflows/build.yml
    with:
      upload-jar: true
      artifact-name: fidorial-server-pr-${{ github.event.pull_request.number }}
      retention-days: 5

  describe:
    name: Update the pull request description
    needs: build
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write

    steps:
      - name: Write the build block into the description
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          JAR: ${{ needs.build.outputs.jar-name }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ github.event.pull_request.head.sha }}
          ARTIFACT_URL: ${{ needs.build.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          begin='<!-- ci:build:begin -->'
          end='<!-- ci:build:end -->'

          cat > block.md <<EOF
          $begin

          ---

          ### Automated section — written by CI, do not edit

          | | |
          |---|---|
          | Jar | \`$JAR\` |
          | Version | \`$VERSION\` |
          | Commit | \`$SHA\` |

          [Download the jar]($ARTIFACT_URL) — available for 5 days, GitHub sign-in required.

          <sub>Updated by [run #${GITHUB_RUN_NUMBER}]($RUN_URL) on $(date -u '+%Y-%m-%d %H:%M UTC').</sub>
          $end
          EOF

          # Current description, empty string when the pull request has none
          gh pr view "$PR" --repo "$REPO" --json body --jq '.body // ""' > current.md

          # Drop the block left by a previous run, keep everything the author wrote
          awk -v b="$begin" -v e="$end" '
            index($0, b) { inside = 1 }
            !inside      { print }
            index($0, e) { inside = 0 }
          ' current.md > kept.md

          kept=$(cat kept.md)

          {
            if [ -n "$kept" ]; then
              printf '%s\n\n' "$kept"
            fi
            cat block.md
          } > new.md

          gh pr edit "$PR" --repo "$REPO" --body-file new.md